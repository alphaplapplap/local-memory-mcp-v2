# Local Memory MCP PostgreSQL Optimizations
# Based on optimize/postgresql_memory_configs.csv analysis
# Apply with: echo "include = '/path/to/postgresql_optimizations.conf'" >> postgresql.conf

# === MEMORY CONFIGURATION ===
# Increase shared_buffers from default 25% to 30% for better vector caching
shared_buffers = 2GB                    # For 8GB system (adjust: 4GB for 16GB, 8GB for 32GB+)

# Optimize work_mem for vector operations - higher than default for complex vector queries
work_mem = 128MB                        # Increased from default 4MB for vector operations

# Maintenance operations optimization
maintenance_work_mem = 1GB              # For index maintenance and VACUUM operations
max_maintenance_work_mem = 2GB          # Maximum for large operations

# === VECTOR-SPECIFIC OPTIMIZATIONS ===
# pgvector HNSW index optimizations
# Note: hnsw.ef_search is set dynamically per query in application code

# === CONNECTION AND CACHE SETTINGS ===
max_connections = 200                   # Balanced for memory/connection ratio
effective_cache_size = 6GB              # Estimate of OS + PostgreSQL cache (75% of RAM)

# === PERFORMANCE TUNING ===
# Optimize for SSD storage
random_page_cost = 1.1                  # Lower for SSD (default: 4.0 for HDD)
seq_page_cost = 1.0

# Checkpoint and WAL optimizations
wal_buffers = 64MB                      # Larger WAL buffers for better write performance
checkpoint_completion_target = 0.9      # Spread checkpoints over longer time
checkpoint_timeout = 15min              # Longer checkpoint intervals

# === QUERY PLANNER OPTIMIZATION ===
# Encourage index usage for vector operations
enable_indexscan = on
enable_bitmapscan = on
enable_seqscan = on                     # Keep enabled but make indexes more attractive

# Cost adjustments for vector operations
cpu_tuple_cost = 0.01                  # Slightly higher CPU cost awareness
cpu_index_tuple_cost = 0.005           # Lower index cost to encourage index usage

# === MONITORING AND LOGGING ===
# Enable query performance tracking
track_functions = all
track_activities = on
track_counts = on
track_io_timing = on

# Log slow queries for optimization
log_min_duration_statement = 1000      # Log queries taking longer than 1 second
log_statement = 'ddl'                  # Log schema changes
log_line_prefix = '%t [%p-%l] %q%u@%d '

# === MEMORY CALCULATION FORMULAS ===
# work_mem calculation: (shared_buffers * 0.8) / max_connections
# For 2GB shared_buffers, 200 connections: (2048 * 0.8) / 200 = ~8MB base + 120MB vector overhead = 128MB
#
# shared_buffers targets by system RAM:
# 8GB RAM:  2GB shared_buffers (25%)
# 16GB RAM: 4GB shared_buffers (25%)
# 32GB RAM: 8GB shared_buffers (25%)
# 64GB RAM: 16GB shared_buffers (25%)
#
# Adjust these values based on your system specifications