# Local Memory MCP PostgreSQL Optimizations
# Auto-generated for Medium Production
# System Memory: 16.0GB
# Generated: Mon 22 Sep 2025 19:00:09 MDT

# === MEMORY CONFIGURATION ===
shared_buffers = 4GB
work_mem = 128MB
maintenance_work_mem = 2GB
effective_cache_size = 12GB
max_connections = 200

# === VECTOR-SPECIFIC OPTIMIZATIONS ===
# pgvector optimizations (hnsw.ef_search set dynamically in application)
enable_indexscan = on
enable_bitmapscan = on

# === SSD OPTIMIZATIONS ===
random_page_cost = 1.1
seq_page_cost = 1.0

# === WRITE PERFORMANCE ===
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# === COST ADJUSTMENTS ===
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005

# === MONITORING ===
track_functions = all
track_activities = on
track_counts = on
track_io_timing = on
log_min_duration_statement = 1000
log_statement = 'ddl'
log_line_prefix = '%t [%p-%l] %q%u@%d '

# === VECTOR MEMORY CALCULATION ===
# work_mem formula: Base (shared_buffers * 0.4 / max_connections) + Vector overhead
# Current: 128MB = Optimized for vector operations
#
